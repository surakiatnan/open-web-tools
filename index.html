<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- ── PWA self-heal ───────────────────────────────────────────────────
      A stale, still-active service worker can keep serving its cached
      index.html after a new deploy — one that references JS/CSS hashes the
      new deploy no longer has. That fails silently as a blank page: the
      entry script 404s before any of our own JS gets a chance to run, so
      recovery has to happen from this early inline script instead. On a
      script/stylesheet load error, drop all service workers + caches and
      reload once (session-guarded so a genuinely offline user isn't caught
      in a reload loop).
    -->
    <script>
      (function () {
        if (!('serviceWorker' in navigator) || sessionStorage.getItem('owt-sw-recovered')) return
        window.addEventListener('error', function (e) {
          var tag = e.target
          if (!tag || (tag.tagName !== 'SCRIPT' && tag.tagName !== 'LINK')) return
          sessionStorage.setItem('owt-sw-recovered', '1')
          Promise.all([
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              return Promise.all(regs.map(function (r) { return r.unregister() }))
            }),
            'caches' in window
              ? caches.keys().then(function (keys) {
                  return Promise.all(keys.map(function (k) { return caches.delete(k) }))
                })
              : Promise.resolve(),
          ]).then(function () { location.reload() })
        }, true)
      })()
    </script>
